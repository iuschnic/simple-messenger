name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get diff
        run: git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          
      - name: AI Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Берём первые 5000 символов diff
          DIFF=$(head -c 5000 diff.txt)
          
          # Сохраняем промпт в файл
          cat > prompt.txt << EOF
          Review this code diff. Be concise in Russian. Focus on bugs and security:
          
          $DIFF
          EOF
          
          # Отправляем запрос через OpenRouter
          RESPONSE=$(curl -s -X POST https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"google/gemma-3n-e2b-it:free\",
              \"messages\": [{\"role\":\"user\",\"content\":$(jq -Rs . < prompt.txt)}]
            }")
          
          # Извлекаем ответ
          COMMENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "API error: " + (.error.message // "Unknown")')
          
          # Отправляем комментарий
          gh pr comment ${{ github.event.pull_request.number }} --body "## 🤖 Review\n\n$COMMENT"