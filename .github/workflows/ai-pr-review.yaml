name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "diff_size=$(wc -c < pr_diff.txt)" >> $GITHUB_OUTPUT

      - name: AI Review via OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF=$(cat pr_diff.txt | head -c 12000)
          
          # Создаём JSON-файл с запросом, чтобы избежать проблем с экранированием
          cat > request.json << EOF
          {
            "model": "google/gemma-3n-e2b-it:free",
            "messages": [
              {
                "role": "user",
                "content": "Ты опытный разработчик. Внимательно проанализируй этот код. Напиши на русском. Обрати внимание на: потенциальные баги, проблемы безопасности, производительность, читаемость кода. Будь конкретен и краток. Используй markdown для форматирования.\n\n${DIFF}"
              }
            ]
          }
          EOF
          
          # Отправляем запрос и сохраняем ответ в файл
          curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json
          
          # Извлекаем комментарий с помощью jq (более надёжно, чем python)
          COMMENT=$(jq -r '.choices[0].message.content // "⚠️ Не удалось получить ответ от AI"' response.json)
          
          # Если комментарий пустой или содержит null, пишем ошибку
          if [ "$COMMENT" = "null" ] || [ -z "$COMMENT" ]; then
            COMMENT="⚠️ AI не смог обработать запрос. Проверь формат diff или попробуй другую модель."
          fi
          
          # Постим комментарий в PR
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## 🤖 AI Code Review\n\n${COMMENT}"